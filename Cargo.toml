[package]
name = "tessera-pool-reader"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-sdk = "2.2"
solana-account = "2.2"
solana-account-decoder = "2.2"
solana-keypair = "2.2"
solana-message = "2.2"
solana-pubkey = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-rpc-client = "2.2"
solana-client = "2.2"
solana-program = "2.2"
solana-system-interface = "1.0.0"
spl-token = "6.0"
spl-associated-token-account = "6.0"
litesvm = "0.6.1"

tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"
borsh = "1.0"
dotenv = "0.15"
bs58 = "0.5"
sha2 = "0.10.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
async-trait = "0.1.89"
