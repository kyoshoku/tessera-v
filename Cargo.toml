[package]
name = "tessera-pool-reader"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-client = "2.0"
solana-sdk = "2.0"
solana-program = "2.0"
solana-account-decoder = "2.0"
spl-token = "6.0"
spl-associated-token-account = "6.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"
borsh = "1.0"
dotenv = "0.15"
bs58 = "0.5"
sha2 = "0.10.8"
